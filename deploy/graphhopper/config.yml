# Minimal GraphHopper server config for the hierarchy profile.
# car_hierarchy.json is generated from routing/ (tests/test_routing.py fails if they drift).
graphhopper:
  datareader.file: /data/region-latest.osm.pbf
  graph.location: /data/graph-cache

  # road_access, toll and max_speed back the restriction rules; country + urban_density
  # are required by the legal-default speed calculator below.
  graph.encoded_values: car_access, car_average_speed, road_class, road_class_link, road_access, toll, max_speed, country, urban_density

  # Fill max_speed from country legal defaults (osm-legal-default-speeds) where no sign is mapped.
  max_speed_calculator.enabled: true
  graph.urban_density.threads: 4

  # Import-time restricted zones (GeoJSON), e.g. ops-defined no-entry areas that rarely change.
  # custom_areas.directory: /data/custom_areas

  profiles:
    - name: car
      custom_model_files: [car_hierarchy.json]

  # No CH: per-request custom models (telemetry overlays) need the flexible path.
  # LM keeps it fast and stays valid because overlays only ever lower speed/priority.
  profiles_ch: []
  profiles_lm:
    - profile: car

  import.osm.ignored_highways: footway,cycleway,path,pedestrian,steps

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0
