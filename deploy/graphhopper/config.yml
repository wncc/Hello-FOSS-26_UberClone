# GraphHopper server config: one profile per vehicle.
# <vehicle>.json files are generated by routing.graphhopper.write_server_models() (tests fail if they drift).
graphhopper:
  datareader.file: /data/region-latest.osm.pbf
  graph.location: /data/graph-cache

  # road_access, toll and max_speed back the restriction rules; country + urban_density
  # are required by the legal-default speed calculator below.
  graph.encoded_values: car_access, car_average_speed, road_class, road_class_link, road_access, toll, max_speed, country, urban_density

  # Fill max_speed from country legal defaults (osm-legal-default-speeds) where no sign is mapped.
  # These are car limits; bike/auto category limits need the plugin in docs/issues/002.
  max_speed_calculator.enabled: true
  graph.urban_density.threads: 4

  # Import-time restricted zones (GeoJSON), e.g. ops-defined no-entry areas that rarely change.
  # custom_areas.directory: /data/custom_areas

  # Turn penalties in the custom models need GraphHopper 11+. OSM turn restrictions are
  # applied per vehicle type; U-turn cost (seconds) matches VehicleProfile.turns.u_turn.
  profiles:
    - name: car
      turn_costs: { vehicle_types: [motorcar, motor_vehicle], u_turn_costs: 25 }
      custom_model_files: [car.json]
    - name: bike
      turn_costs: { vehicle_types: [motorcycle, motor_vehicle], u_turn_costs: 12 }
      custom_model_files: [bike.json]
    - name: auto_rickshaw
      turn_costs: { vehicle_types: [motorcar, motorcycle, motor_vehicle], u_turn_costs: 18 }
      custom_model_files: [auto_rickshaw.json]

  # No CH: per-request custom models (telemetry overlays) need the flexible path.
  # LM keeps it fast and stays valid because overlays only ever lower speed/priority.
  profiles_ch: []
  profiles_lm:
    - profile: car
    - profile: bike
    - profile: auto_rickshaw

  import.osm.ignored_highways: footway,cycleway,path,pedestrian,steps

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0
